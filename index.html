<title>Agenda</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #202b25;
    --surface: #26332c;
    --surface-2: #2e3d34;
    --line: #3b4a40;
    --line-soft: #33423a;
    --ink: #ece5d4;
    --ink-dim: #9caa9f;
    --ink-faint: #6f7d73;
    --amber: #d7a24a;
    --amber-dim: #a98038;
    --rust: #b9633f;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    padding: 0;
  }

  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom: 24px;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 16px;
  }

  h1{
    font-family: 'Roboto Slab', serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  h1 span{ color: var(--amber); }

  .fecha-hoy{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-faint);
    text-transform: capitalize;
    text-align: right;
  }

  .salir-btn{
    background: none;
    border: none;
    color: var(--amber-dim);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    cursor: pointer;
    padding: 0;
    margin-top: 6px;
    display:block;
  }
  .salir-btn:hover{ color: var(--amber); }

  .add-box{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }

  .add-row{ display:flex; gap:8px; margin-bottom: 10px; }
  .add-row:last-child{ margin-bottom:0; }

  input[type="text"], select, input[type="date"], input[type="time"], input[type="password"]{
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 7px;
    padding: 9px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
  }

  input[type="text"]{ flex:1; min-width: 0; }
  input[type="text"]::placeholder, input[type="password"]::placeholder{ color: var(--ink-faint); }
  input:focus, select:focus{ border-color: var(--amber-dim); }

  select{ flex: 0 0 auto; color-scheme: dark; }

  input[type="date"], input[type="time"]{
    flex: 1 1 0;
    min-width: 0;
    color-scheme: dark;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  .btn-add, .btn-guardar, .btn-desbloquear{
    flex: 0 0 auto;
    background: var(--amber);
    border: none;
    color: #221a0d;
    font-weight: 600;
    font-size: 14px;
    border-radius: 7px;
    padding: 9px 16px;
    cursor: pointer;
  }
  .btn-add:hover, .btn-guardar:hover, .btn-desbloquear:hover{ background: #e6b25c; }
  .btn-add:active, .btn-guardar:active, .btn-desbloquear:active{ transform: scale(0.97); }
  .btn-add:disabled, .btn-guardar:disabled, .btn-desbloquear:disabled{ opacity: 0.5; cursor: default; }

  .btn-cancelar{
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    border-radius: 7px;
    padding: 7px 14px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-dim);
  }
  .btn-cancelar:hover{ border-color: var(--ink-faint); }

  .err{ color: var(--rust); font-size: 12px; margin-top: 8px; display:none; }

  .filtros{ display:flex; gap: 6px; margin-bottom: 16px; }
  .filtro-btn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
  }
  .filtro-btn.activo{
    border-color: var(--amber-dim);
    color: var(--amber);
    background: rgba(215,162,74,0.08);
  }

  .lista{ display:flex; flex-direction:column; }

  .tarea{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    padding: 14px 4px;
    border-bottom: 1px dashed var(--line-soft);
  }
  .tarea:last-child{ border-bottom:none; }

  .check{
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-faint);
    flex: 0 0 auto;
    margin-top: 2px;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    background: transparent;
    padding: 0;
  }
  .check.hecha{ background: var(--amber); border-color: var(--amber); }
  .check svg{ width: 12px; height: 12px; opacity: 0; }
  .check.hecha svg{ opacity: 1; }

  .cuerpo{ flex:1; min-width: 0; }
  .titulo{ font-size: 15px; line-height: 1.4; color: var(--ink); word-break: break-word; cursor: pointer; }
  .tarea.hecha .titulo{ color: var(--ink-faint); text-decoration: line-through; }

  .meta{ display:flex; gap:8px; margin-top: 6px; flex-wrap: wrap; }
  .chip{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    color: var(--ink-dim);
    background: var(--surface-2);
    border: 1px solid var(--line);
  }
  .chip.fecha{ color: var(--amber); border-color: var(--amber-dim); }
  .chip.vencida{ color: #e08a6a; border-color: var(--rust); }

  .acciones{ display:flex; gap: 2px; flex: 0 0 auto; }
  .del, .edit{
    background: transparent; border: none;
    color: var(--ink-faint); cursor: pointer;
    padding: 4px; margin-top: 2px;
  }
  .del:hover{ color: var(--rust); }
  .edit:hover{ color: var(--amber); }

  .edit-box{ flex: 1; min-width: 0; }
  .edit-row{ display:flex; gap: 8px; margin-bottom: 8px; }
  .edit-row:last-child{ margin-bottom: 0; }
  .edit-row input[type="text"]{ width: 100%; }
  .edit-acciones{ display:flex; gap: 8px; }

  .vacio{ text-align:center; padding: 60px 20px; color: var(--ink-faint); }
  .vacio .icono{ font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
  .vacio p{ font-size: 14px; margin: 0; }

  .contador{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 24px;
    text-align: center;
  }

  .toast{
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 50;
  }
  .toast.visible{ opacity: 1; }
  .toast.error{ border-color: var(--rust); color: #e08a6a; }

  .lock-wrap{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
  }
  .lock-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px 28px;
    max-width: 340px;
    width: 100%;
    text-align: center;
  }
  .lock-card h1{ margin-bottom: 6px; }
  .lock-card p{
    color: var(--ink-dim);
    font-size: 13px;
    margin: 0 0 20px;
  }
  input[type="password"]{
    width: 100%;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    letter-spacing: 4px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .btn-desbloquear{ width: 100%; padding: 12px; }
  .lock-err{
    color: var(--rust);
    font-size: 12px;
    margin-top: 12px;
    display:none;
  }

  .spinner{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-faint);
    font-size: 13px;
  }

  @media (max-width: 480px){
    .add-row{ flex-wrap: wrap; }
    .add-row input[type="text"]{ flex-basis: 100%; }
  }
</style>
</head>
<body>

<div id="pantallaCandado" class="lock-wrap">
  <div class="lock-card">
    <h1>Mi <span style="color:var(--amber)">agenda</span></h1>
    <p>Ingresá tu clave para entrar</p>
    <input type="password" id="inputPin" placeholder="••••" inputmode="numeric" autocomplete="off">
    <button class="btn-desbloquear" id="btnDesbloquear">Entrar</button>
    <div class="lock-err" id="lockErr">Clave incorrecta. Probá de nuevo.</div>
  </div>
</div>

<div id="app" class="wrap" style="display:none;">
  <header>
    <h1>Mi <span>agenda</span></h1>
    <div>
      <div class="fecha-hoy" id="fechaHoy"></div>
      <button class="salir-btn" id="btnSalir">Cerrar sesión</button>
    </div>
  </header>

  <div class="add-box">
    <div class="add-row">
      <input type="text" id="inputTitulo" placeholder='Ej: pedir factura a Limagrain por las bolsas de Jorge Proch' maxlength="200">
      <button class="btn-add" id="btnAdd">Anotar</button>
    </div>
    <div class="add-row">
      <select id="inputCategoria">
        <option value="General">General</option>
        <option value="Pago">Pago</option>
        <option value="Compra">Compra</option>
        <option value="Trámite">Trámite</option>
        <option value="Vehículo">Vehículo</option>
        <option value="Campo">Campo</option>
      </select>
      <input type="date" id="inputFecha">
      <input type="time" id="inputHora">
    </div>
    <div class="err" id="errMsg">Escribí algo para anotar.</div>
  </div>

  <div class="filtros">
    <button class="filtro-btn activo" data-filtro="pendientes">Pendientes</button>
    <button class="filtro-btn" data-filtro="hechas">Hechas</button>
    <button class="filtro-btn" data-filtro="todas">Todas</button>
  </div>

  <div class="lista" id="lista"><div class="spinner">Cargando...</div></div>
  <div class="contador" id="contador"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycby7N9aekMtAu1LJEmWGZGoemizXdM_GPizvtO7wNlyX4TapL2B-Im0RzDVgc3e8dL_sbg/exec';
  const PIN_KEY = 'agenda-pin';

  let tareas = [];
  let filtroActual = 'pendientes';
  let editandoId = null;
  let pin = null;

  const pantallaCandado = document.getElementById('pantallaCandado');
  const appEl = document.getElementById('app');
  const inputPin = document.getElementById('inputPin');
  const lockErr = document.getElementById('lockErr');
  const listaEl = document.getElementById('lista');
  const contadorEl = document.getElementById('contador');
  const inputTitulo = document.getElementById('inputTitulo');
  const inputCategoria = document.getElementById('inputCategoria');
  const inputFecha = document.getElementById('inputFecha');
  const inputHora = document.getElementById('inputHora');
  const errMsg = document.getElementById('errMsg');
  const toastEl = document.getElementById('toast');

  function fechaHoyTexto(){
    const hoy = new Date();
    const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    return `${dias[hoy.getDay()]}, ${hoy.getDate()} de ${meses[hoy.getMonth()]}`;
  }

  function mostrarToast(msg, esError){
    toastEl.textContent = msg;
    toastEl.className = 'toast visible' + (esError ? ' error' : '');
    setTimeout(() => { toastEl.className = 'toast'; }, 2600);
  }

  async function llamarApi(action, data){
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: pin, action, data: data || {} })
    });
    if(!resp.ok) throw new Error('network');
    return await resp.json();
  }

  async function intentarDesbloquear(){
    const valor = inputPin.value.trim();
    if(!valor) return;
    const btn = document.getElementById('btnDesbloquear');
    btn.disabled = true;
    btn.textContent = 'Verificando...';
    lockErr.style.display = 'none';
    try{
      pin = valor;
      const res = await llamarApi('list');
      if(res.ok){
        localStorage.setItem(PIN_KEY, pin);
        tareas = res.tareas;
        mostrarApp();
      } else {
        pin = null;
        lockErr.textContent = res.error || 'Clave incorrecta. Probá de nuevo.';
        lockErr.style.display = 'block';
        inputPin.value = '';
        inputPin.focus();
      }
    }catch(e){
      pin = null;
      lockErr.textContent = 'No se pudo conectar. Revisá tu conexión.';
      lockErr.style.display = 'block';
    }
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }

  function mostrarApp(){
    pantallaCandado.style.display = 'none';
    appEl.style.display = 'block';
    document.getElementById('fechaHoy').textContent = fechaHoyTexto();
    render();
  }

  function cerrarSesion(){
    localStorage.removeItem(PIN_KEY);
    pin = null;
    tareas = [];
    appEl.style.display = 'none';
    pantallaCandado.style.display = 'flex';
    inputPin.value = '';
    inputPin.focus();
  }

  async function recargar(){
    try{
      const res = await llamarApi('list');
      if(res.ok){ tareas = res.tareas; render(); }
      else { mostrarToast(res.error || 'Error al cargar', true); }
    }catch(e){
      mostrarToast('No se pudo conectar. Revisá tu conexión.', true);
    }
  }

  function formatearFechaChip(fechaStr, horaStr){
    if(!fechaStr) return null;
    const [y,m,d] = fechaStr.split('-');
    let texto = `${d}/${m}`;
    if(horaStr) texto += ` ${horaStr}`;
    const fechaObj = new Date(fechaStr + 'T' + (horaStr || '23:59'));
    return { texto, vencida: fechaObj < new Date() };
  }

  async function crearTarea(){
    const titulo = inputTitulo.value.trim();
    if(!titulo){
      errMsg.style.display = 'block';
      inputTitulo.focus();
      return;
    }
    errMsg.style.display = 'none';
    const btn = document.getElementById('btnAdd');
    btn.disabled = true;
    try{
      const res = await llamarApi('add', {
        titulo,
        categoria: inputCategoria.value,
        fecha: inputFecha.value || null,
        hora: inputHora.value || null
      });
      if(res.ok){
        tareas = res.tareas;
        inputTitulo.value = '';
        inputFecha.value = '';
        inputHora.value = '';
        inputCategoria.value = 'General';
        render();
        inputTitulo.focus();
      } else {
        mostrarToast(res.error || 'No se pudo guardar', true);
      }
    }catch(e){
      mostrarToast('No se pudo conectar. Revisá tu conexión.', true);
    }
    btn.disabled = false;
  }

  async function toggleHecha(id){
    try{
      const res = await llamarApi('toggle', { id });
      if(res.ok){ tareas = res.tareas; render(); }
      else mostrarToast(res.error || 'No se pudo actualizar', true);
    }catch(e){
      mostrarToast('No se pudo conectar. Revisá tu conexión.', true);
    }
  }

  async function borrarTarea(id){
    try{
      const res = await llamarApi('delete', { id });
      if(res.ok){ tareas = res.tareas; render(); mostrarToast('Anotación borrada'); }
      else mostrarToast(res.error || 'No se pudo borrar', true);
    }catch(e){
      mostrarToast('No se pudo conectar. Revisá tu conexión.', true);
    }
  }

  function iniciarEdicion(id){ editandoId = id; render(); }
  function cancelarEdicion(){ editandoId = null; render(); }

  async function guardarEdicion(id){
    const nuevoTitulo = document.getElementById('edit-titulo-' + id).value.trim();
    const errEl = document.getElementById('edit-err-' + id);
    if(!nuevoTitulo){ errEl.style.display = 'block'; return; }

    const data = {
      id,
      titulo: nuevoTitulo,
      categoria: document.getElementById('edit-cat-' + id).value,
      fecha: document.getElementById('edit-fecha-' + id).value || null,
      hora: document.getElementById('edit-hora-' + id).value || null
    };
    try{
      const res = await llamarApi('update', data);
      if(res.ok){
        tareas = res.tareas;
        editandoId = null;
        render();
        mostrarToast('Anotación actualizada');
      } else {
        mostrarToast(res.error || 'No se pudo guardar', true);
      }
    }catch(e){
      mostrarToast('No se pudo conectar. Revisá tu conexión.', true);
    }
  }

  function ordenar(lista){
    return lista.slice().sort((a,b) => {
      if(a.hecha !== b.hecha) return a.hecha ? 1 : -1;
      const fa = a.fecha ? new Date(a.fecha + 'T' + (a.hora || '00:00')).getTime() : Infinity;
      const fb = b.fecha ? new Date(b.fecha + 'T' + (b.hora || '00:00')).getTime() : Infinity;
      if(fa !== fb) return fa - fb;
      return (b.creada || 0) - (a.creada || 0);
    });
  }

  function render(){
    let visibles = tareas;
    if(filtroActual === 'pendientes') visibles = tareas.filter(t => !t.hecha);
    else if(filtroActual === 'hechas') visibles = tareas.filter(t => t.hecha);

    visibles = ordenar(visibles);
    listaEl.innerHTML = '';

    if(visibles.length === 0){
      const vacio = document.createElement('div');
      vacio.className = 'vacio';
      let msg = 'No tenés anotaciones pendientes.';
      if(filtroActual === 'hechas') msg = 'Todavía no marcaste nada como hecho.';
      if(filtroActual === 'todas') msg = 'Tu agenda está vacía. Anotá lo primero que se te ocurra.';
      vacio.innerHTML = `<div class="icono">&#9998;</div><p>${msg}</p>`;
      listaEl.appendChild(vacio);
    } else {
      visibles.forEach(t => {
        const row = document.createElement('div');
        row.className = 'tarea' + (t.hecha ? ' hecha' : '');

        if(editandoId === t.id){
          const editBox = document.createElement('div');
          editBox.className = 'edit-box';
          const catOpciones = ['General','Pago','Compra','Trámite','Vehículo','Campo']
            .map(c => `<option value="${c}" ${c === t.categoria ? 'selected' : ''}>${c}</option>`)
            .join('');
          editBox.innerHTML = `
            <div class="edit-row"><input type="text" id="edit-titulo-${t.id}" value="${(t.titulo||'').replace(/"/g,'&quot;')}" maxlength="200"></div>
            <div class="edit-row">
              <select id="edit-cat-${t.id}">${catOpciones}</select>
              <input type="date" id="edit-fecha-${t.id}" value="${t.fecha || ''}">
              <input type="time" id="edit-hora-${t.id}" value="${t.hora || ''}">
            </div>
            <div class="err" id="edit-err-${t.id}">Escribí algo para anotar.</div>
            <div class="edit-row edit-acciones">
              <button class="btn-guardar" id="edit-guardar-${t.id}">Guardar</button>
              <button class="btn-cancelar" id="edit-cancelar-${t.id}">Cancelar</button>
            </div>`;
          row.appendChild(editBox);
          listaEl.appendChild(row);
          document.getElementById('edit-guardar-' + t.id).onclick = () => guardarEdicion(t.id);
          document.getElementById('edit-cancelar-' + t.id).onclick = cancelarEdicion;
          document.getElementById('edit-titulo-' + t.id).addEventListener('input', () => {
            document.getElementById('edit-err-' + t.id).style.display = 'none';
          });
          document.getElementById('edit-titulo-' + t.id).focus();
          return;
        }

        const check = document.createElement('button');
        check.className = 'check' + (t.hecha ? ' hecha' : '');
        check.setAttribute('aria-label', t.hecha ? 'Marcar como pendiente' : 'Marcar como hecha');
        check.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8L6.5 11.5L13 4.5" stroke="#221a0d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        check.onclick = () => toggleHecha(t.id);

        const cuerpo = document.createElement('div');
        cuerpo.className = 'cuerpo';

        const titulo = document.createElement('div');
        titulo.className = 'titulo';
        titulo.textContent = t.titulo;
        titulo.onclick = () => iniciarEdicion(t.id);
        cuerpo.appendChild(titulo);

        const meta = document.createElement('div');
        meta.className = 'meta';
        const fechaInfo = formatearFechaChip(t.fecha, t.hora);
        if(fechaInfo){
          const chipFecha = document.createElement('span');
          chipFecha.className = 'chip fecha' + (fechaInfo.vencida && !t.hecha ? ' vencida' : '');
          chipFecha.textContent = fechaInfo.texto;
          meta.appendChild(chipFecha);
        }
        if(t.categoria && t.categoria !== 'General'){
          const chipCat = document.createElement('span');
          chipCat.className = 'chip cat';
          chipCat.textContent = t.categoria;
          meta.appendChild(chipCat);
        }
        if(meta.children.length > 0) cuerpo.appendChild(meta);

        const acciones = document.createElement('div');
        acciones.className = 'acciones';
        const edit = document.createElement('button');
        edit.className = 'edit';
        edit.setAttribute('aria-label', 'Editar');
        edit.innerHTML = '&#9998;';
        edit.onclick = () => iniciarEdicion(t.id);
        const del = document.createElement('button');
        del.className = 'del';
        del.setAttribute('aria-label', 'Borrar');
        del.innerHTML = '&#10005;';
        del.onclick = () => borrarTarea(t.id);
        acciones.appendChild(edit);
        acciones.appendChild(del);

        row.appendChild(check);
        row.appendChild(cuerpo);
        row.appendChild(acciones);
        listaEl.appendChild(row);
      });
    }

    const totalPend = tareas.filter(t => !t.hecha).length;
    contadorEl.textContent = totalPend === 0 ? 'Todo al día' : `${totalPend} anotación${totalPend === 1 ? '' : 'es'} pendiente${totalPend === 1 ? '' : 's'}`;
  }

  document.getElementById('btnAdd').onclick = crearTarea;
  inputTitulo.addEventListener('keydown', (e) => { if(e.key === 'Enter') crearTarea(); });
  inputTitulo.addEventListener('input', () => { if(inputTitulo.value.trim()) errMsg.style.display = 'none'; });

  document.querySelectorAll('.filtro-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
      btn.classList.add('activo');
      filtroActual = btn.dataset.filtro;
      render();
    });
  });

  document.getElementById('btnDesbloquear').onclick = intentarDesbloquear;
  inputPin.addEventListener('keydown', (e) => { if(e.key === 'Enter') intentarDesbloquear(); });
  document.getElementById('btnSalir').onclick = cerrarSesion;

  (async function init(){
    const guardado = localStorage.getItem(PIN_KEY);
    if(guardado){
      pin = guardado;
      try{
        const res = await llamarApi('list');
        if(res.ok){
          tareas = res.tareas;
          mostrarApp();
          return;
        }
      }catch(e){}
      pin = null;
      localStorage.removeItem(PIN_KEY);
    }
    inputPin.focus();
  })();
</script>

</body>
</html>
